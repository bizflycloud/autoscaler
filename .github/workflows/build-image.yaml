name: Build & Push cluster-autoscaler image

on:
  push:
    branches:
      - master
    paths:
      - 'cluster-autoscaler/**'
      - '.github/workflows/build-image.yaml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (default: bizflycloud-<sha>)'
        required: false

env:
  REGISTRY: cr-hn-1.bizflycloud.vn
  IMAGE_NAMESPACE: 31ff9581861a4d0ea4df5e7dda0f665d
  IMAGE_NAME: cluster-autoscaler-amd64
  GOPATH: ${{ github.workspace }}/go

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: ${{ env.GOPATH }}/src/k8s.io/autoscaler

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.24.0'
          cache-dependency-path: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler/go.sum

      - name: Run bizflycloud provider tests
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler
        run: go test ./cloudprovider/bizflycloud/... -v -count=1
        env:
          GO111MODULE: on

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set image tag
        id: tag
        run: |
          CUSTOM_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            echo "tag=$CUSTOM_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=bizflycloud-$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to BizFly Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cluster-autoscaler
          file: cluster-autoscaler/Dockerfile
          push: true
          build-args: |
            GOARCH=amd64
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:bizflycloud-master
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:bizflycloud-master" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Update bke-orchestrator \`v1.py\` to use tag: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
