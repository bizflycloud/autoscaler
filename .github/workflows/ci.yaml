name: Tests

on:
  - push
  - pull_request

env:
  GOPATH: ${{ github.workspace }}/go

permissions:
  contents: read
  checks: write

jobs:
  test-and-verify:
    name: Run cluster-autoscaler bizflycloud tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: ${{ env.GOPATH }}/src/k8s.io/autoscaler

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.24.0'
          cache-dependency-path: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler/go.sum

      - name: Test bizflycloud provider
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler
        run: go test ./cloudprovider/bizflycloud/... -v -count=1 -race
        env:
          GO111MODULE: "on"

      - name: Build cluster-autoscaler
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler
        run: go build ./...
        env:
          GO111MODULE: "on"
